<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premium Pong</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

  :root {
    --p1: #ff5722;
    --p2: #00bcd4;
    --ball: #ffeb3b;
    --bg: #0a0a0a;
    --text: #ffffff;
    --glass: rgba(255, 255, 255, 0.1);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  
  body, html {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Press Start 2P', cursive;
  }
  
  /* CRT */
  body::after {
    content: " "; display: block; position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
  }
  
  #starfield { position: absolute; z-index: 0; top:0; left:0; width:100%; height:100%; }
  #gameCanvas {
    position: absolute; z-index: 10;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.1);
    transition: box-shadow 0.3s, border-color 0.3s;
    max-width: 90vw; max-height: 80vh;
  }
  
  #ui {
    position: absolute; z-index: 20; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2vh 0;
  }
  
  .score-board {
    font-family: 'Orbitron', sans-serif; text-align: center;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .scores { font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; letter-spacing: 5px; }
  .p1-score { color: var(--p1); text-shadow: 0 0 15px var(--p1); }
  .p2-score { color: var(--p2); text-shadow: 0 0 15px var(--p2); }
  .wins { font-size: clamp(0.7rem, 2vw, 1.2rem); margin-top: 10px; color: #888; font-family: 'Press Start 2P', cursive; }
  .wins span.w1 { color: var(--p1); }
  .wins span.w2 { color: var(--p2); }
  
  .controls-hint {
    font-size: clamp(0.5rem, 1vw, 0.8rem); text-align: center; color: #666;
    background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;
    backdrop-filter: blur(5px); display: flex; gap: 20px;
  }
  
  .sound-btn {
    position: absolute; top: 20px; right: 20px; font-size: 1.5rem;
    pointer-events: auto; cursor: pointer; z-index: 1000;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 50px; height: 50px; display: flex;
    align-items: center; justify-content: center; backdrop-filter: blur(5px);
    transition: transform 0.2s, background 0.2s;
  }
  .sound-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
  
  /* Overlays */
  .overlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
    z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: auto;
    opacity: 0; transition: opacity 0.3s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .overlay:not(.active) { pointer-events: none; }
  
  .panel {
    background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
    padding: 40px; border-radius: 20px; text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.5); transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .overlay.active .panel { transform: scale(1); }
  
  h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; margin-bottom: 30px; letter-spacing: 2px;
       background: -webkit-linear-gradient(var(--p1), var(--p2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  .btn {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    color: white; padding: 15px 30px; font-family: 'Press Start 2P', cursive;
    font-size: 1rem; border-radius: 10px; cursor: pointer; margin: 10px;
    transition: all 0.2s; text-transform: uppercase;
  }
  .btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
  .btn.active { background: white; color: black; }
  
  .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
  .tab { padding: 10px 20px; font-size: 0.8rem; cursor: pointer; border: 1px solid #555; border-radius: 5px; opacity: 0.5; transition: 0.2s; }
  .tab.active { opacity: 1; border-color: white; background: rgba(255,255,255,0.1); }
  
  .diff-easy { color: #4caf50; border-color: #4caf50; }
  .diff-med { color: #ff9800; border-color: #ff9800; }
  .diff-hard { color: #f44336; border-color: #f44336; }
  
  #game-ui { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #game-ui.active { opacity: 1; pointer-events: auto; }
  
  .paused-text { font-family: 'Orbitron', sans-serif; font-size: 4rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; text-shadow: 0 0 20px white; }
  #gameCanvas.paused { filter: brightness(0.4); }
  .paused-overlay { display: none; }
  .paused-overlay.active { display: block; }

  /* Speed indicator */
  #speed-hud { position: absolute; bottom: 20px; right: 20px; font-size: 0.6rem; color: #aaa; text-align: right; }
  #speed-bar { width: 100px; height: 5px; background: rgba(255,255,255,0.2); margin-top: 5px; position: relative; border-radius: 2px; overflow: hidden; }
  #speed-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--ball); transition: width 0.1s; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<div class="sound-btn" id="soundBtn">🔊</div>

<div id="ui">
  <div class="score-board">
    <div class="scores">
      <span class="p1-score" id="s1">0</span> <span style="color:#444">-</span> <span class="p2-score" id="s2">0</span>
    </div>
    <div class="wins">
      P1 WINS: <span class="w1" id="w1">0</span> &nbsp;|&nbsp; P2 WINS: <span class="w2" id="w2">0</span>
    </div>
  </div>
  
  <div class="paused-text paused-overlay">PAUSED</div>
  
  <div class="controls-hint">
    <div id="p1-hint">P1: W / S</div>
    <div id="p2-hint">P2: CPU</div>
    <div>SPACE: Pause</div>
    <div>R: Restart Match</div>
  </div>
</div>

<div id="speed-hud">
  BALL SPEED
  <div id="speed-bar"><div id="speed-fill"></div></div>
</div>

<div class="overlay active" id="startOverlay">
  <div class="panel">
    <h1>PONG</h1>
    <div class="tabs">
      <div class="tab active" data-mode="cpu">VS CPU</div>
      <div class="tab" data-mode="p2">2 PLAYER</div>
    </div>
    <div id="diffTabs" class="tabs">
      <div class="tab diff-easy active" data-diff="0">EASY</div>
      <div class="tab diff-med" data-diff="1">MED</div>
      <div class="tab diff-hard" data-diff="2">HARD</div>
    </div>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="panel">
    <h1 id="resultTitle">P1 WINS!</h1>
    <button class="btn" id="nextMatchBtn">NEXT MATCH</button>
  </div>
</div>
<script>
// --- Audio System (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundEnabled = true;

const playTone = (freq, type, duration, vol=0.1) => {
  if (!soundEnabled || audioCtx.state === 'suspended') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
};

const sounds = {
  paddle: () => playTone(600, 'square', 0.1, 0.1),
  wall: () => playTone(800, 'square', 0.1, 0.1),
  score: () => {
    if (!soundEnabled) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  },
  win: () => {
    if (!soundEnabled) return;
    [400, 500, 600, 800].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.2, 0.1), i * 150);
    });
  }
};

document.getElementById('soundBtn').addEventListener('click', (e) => {
  soundEnabled = !soundEnabled;
  e.target.textContent = soundEnabled ? '🔊' : '🔇';
  if(soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
});

// --- Starfield Background ---
const bgCanvas = document.getElementById('starfield');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];
const resizeBg = () => { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; };
window.addEventListener('resize', resizeBg);
resizeBg();

for(let i=0; i<150; i++) {
  stars.push({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    s: Math.random() * 2,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5
  });
}
const drawBg = () => {
  bgCtx.fillStyle = '#0a0a0a';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  
  const t = Date.now() * 0.001;
  const gradient = bgCtx.createRadialGradient(
    bgCanvas.width/2 + Math.sin(t)*200, bgCanvas.height/2 + Math.cos(t*0.8)*200, 0,
    bgCanvas.width/2, bgCanvas.height/2, bgCanvas.width
  );
  gradient.addColorStop(0, 'rgba(0, 188, 212, 0.05)');
  gradient.addColorStop(0.5, 'rgba(255, 87, 34, 0.05)');
  gradient.addColorStop(1, 'transparent');
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0,0,bgCanvas.width, bgCanvas.height);

  bgCtx.fillStyle = 'rgba(255,255,255,0.5)';
  stars.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    if(s.x < 0) s.x = bgCanvas.width; if(s.x > bgCanvas.width) s.x = 0;
    if(s.y < 0) s.y = bgCanvas.height; if(s.y > bgCanvas.height) s.y = 0;
    bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.s, 0, Math.PI*2); bgCtx.fill();
  });
  
  bgCtx.strokeStyle = 'rgba(255,255,255,0.02)';
  bgCtx.lineWidth = 1;
  for(let x=0; x<bgCanvas.width; x+=50) { bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,bgCanvas.height); bgCtx.stroke(); }
  for(let y=0; y<bgCanvas.height; y+=50) { bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(bgCanvas.width,y); bgCtx.stroke(); }

  requestAnimationFrame(drawBg);
};
drawBg();
// --- Game Logic ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width; const H = canvas.height;

const P1_COLOR = '#ff5722';
const P2_COLOR = '#00bcd4';
const BALL_COLOR = '#ffeb3b';

let mode = 'cpu';
let difficulty = 1;
const diffSettings = [
  { speed: 3, error: 40, missChance: 0.35 },
  { speed: 5, error: 20, missChance: 0.15 },
  { speed: 7, error: 5, missChance: 0.02 }
];

let state = 'menu';
let score1 = 0, score2 = 0;
let wins1 = 0, wins2 = 0;
let countdown = 0;
let impactText = null;

const keys = { w:false, s:false, up:false, down:false };
window.addEventListener('keydown', e => {
  if(e.code === 'KeyW') keys.w = true;
  if(e.code === 'KeyS') keys.s = true;
  if(e.code === 'ArrowUp') { keys.up = true; e.preventDefault(); }
  if(e.code === 'ArrowDown') { keys.down = true; e.preventDefault(); }
  if(e.code === 'Space' && (state === 'playing' || state === 'paused')) togglePause();
  if(e.code === 'KeyR') startMatch();
});
window.addEventListener('keyup', e => {
  if(e.code === 'KeyW') keys.w = false;
  if(e.code === 'KeyS') keys.s = false;
  if(e.code === 'ArrowUp') keys.up = false;
  if(e.code === 'ArrowDown') keys.down = false;
});

const paddleW = 15;
const paddleH = 80;
const paddleSpeed = 7;
let p1 = { x: 30, y: H/2 - paddleH/2, color: P1_COLOR };
let p2 = { x: W - 30 - paddleW, y: H/2 - paddleH/2, color: P2_COLOR };

const initBallSpeed = 5;
const maxBallSpeed = 15;
let ball = { x: W/2, y: H/2, r: 8, vx: initBallSpeed, vy: initBallSpeed, trail: [] };
let particles = [];

const resetBall = (scorer) => {
  ball.x = W/2; ball.y = H/2;
  ball.trail = [];
  const dir = scorer === 1 ? -1 : 1;
  const angle = (Math.random() - 0.5) * Math.PI/4;
  ball.vx = dir * initBallSpeed * Math.cos(angle);
  ball.vy = initBallSpeed * Math.sin(angle);
  state = 'countdown';
  countdown = 3;
  let cdInt = setInterval(() => {
    countdown--;
    if(countdown <= 0) { clearInterval(cdInt); state = 'playing'; }
  }, 800);
};

const spawnParticles = (x, y, color, count=20) => {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
      life: 1, color, size: Math.random()*4+2
    });
  }
};

const startMatch = () => {
  score1 = 0; score2 = 0;
  updateUI();
  document.getElementById('startOverlay').classList.remove('active');
  document.getElementById('resultOverlay').classList.remove('active');
  resetBall(Math.random() > 0.5 ? 1 : 2);
  if(audioCtx.state === 'suspended' && soundEnabled) audioCtx.resume();
};

const endGame = (winner) => {
  state = 'gameover';
  sounds.win();
  if(winner === 1) wins1++; else wins2++;
  updateUI();
  document.getElementById('resultTitle').textContent = "P" + winner + " WINS!";
  document.getElementById('resultTitle').style.color = winner === 1 ? P1_COLOR : P2_COLOR;
  document.getElementById('resultOverlay').classList.add('active');
  spawnParticles(winner === 1 ? p1.x : p2.x, H/2, winner === 1 ? P1_COLOR : P2_COLOR, 100);
};

const togglePause = () => {
  if(state === 'playing') { state = 'paused'; canvas.classList.add('paused'); document.querySelector('.paused-overlay').classList.add('active'); }
  else if(state === 'paused') { state = 'playing'; canvas.classList.remove('paused'); document.querySelector('.paused-overlay').classList.remove('active'); }
};

const updateUI = () => {
  document.getElementById('s1').textContent = score1;
  document.getElementById('s2').textContent = score2;
  document.getElementById('w1').textContent = wins1;
  document.getElementById('w2').textContent = wins2;
  
  const currentSpeed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
  const speedPct = Math.min(100, ((currentSpeed - initBallSpeed) / (maxBallSpeed - initBallSpeed)) * 100);
  document.getElementById('speed-fill').style.width = speedPct + "%";
  
  if(score1 > score2) canvas.style.borderColor = P1_COLOR;
  else if(score2 > score1) canvas.style.borderColor = P2_COLOR;
  else canvas.style.borderColor = 'rgba(255,255,255,0.1)';
};

// UI Listeners
document.querySelectorAll('.tab[data-mode]').forEach(t => t.addEventListener('click', e => {
  document.querySelectorAll('.tab[data-mode]').forEach(el => el.classList.remove('active'));
  e.target.classList.add('active');
  mode = e.target.dataset.mode;
  document.getElementById('diffTabs').style.display = mode === 'cpu' ? 'flex' : 'none';
  document.getElementById('p2-hint').textContent = mode === 'cpu' ? 'P2: CPU' : 'P2: UP / DOWN';
  document.getElementById('p1-hint').textContent = mode === 'cpu' ? 'YOU: W/S or ↑/↓' : 'P1: W / S';
}));
document.querySelectorAll('.tab[data-diff]').forEach(t => t.addEventListener('click', e => {
  document.querySelectorAll('.tab[data-diff]').forEach(el => el.classList.remove('active'));
  e.target.classList.add('active');
  difficulty = parseInt(e.target.dataset.diff);
}));
document.getElementById('startBtn').addEventListener('click', startMatch);
document.getElementById('nextMatchBtn').addEventListener('click', startMatch);
const update = () => {
  if(state !== 'playing') return;
  
  // P1 Move — W/S always; arrow keys also control P1 in CPU mode
  if(keys.w) p1.y -= paddleSpeed;
  if(keys.s) p1.y += paddleSpeed;
  if(mode === 'cpu' && keys.up)   p1.y -= paddleSpeed;
  if(mode === 'cpu' && keys.down) p1.y += paddleSpeed;
  p1.y = Math.max(0, Math.min(H - paddleH, p1.y));
  
  // P2 Move
  if(mode === 'p2') {
    if(keys.up) p2.y -= paddleSpeed;
    if(keys.down) p2.y += paddleSpeed;
  } else {
    // CPU Logic
    const diff = diffSettings[difficulty];
    const targetY = ball.y - paddleH/2 + (Math.random()-0.5)*diff.error;
    if(ball.vx > 0) { 
      if(p2.y < targetY - 10) p2.y += diff.speed;
      else if(p2.y > targetY + 10) p2.y -= diff.speed;
    }
    if(Math.random() < 0.01 && Math.random() < diff.missChance) {
      p2.y += (Math.random()>0.5?1:-1) * paddleSpeed * 2;
    }
  }
  p2.y = Math.max(0, Math.min(H - paddleH, p2.y));
  
  // Ball Move
  ball.trail.push({x: ball.x, y: ball.y});
  if(ball.trail.length > 5) ball.trail.shift();
  
  ball.x += ball.vx; ball.y += ball.vy;
  
  // Wall collision
  if(ball.y - ball.r < 0 || ball.y + ball.r > H) {
    ball.vy *= -1;
    ball.y = ball.y - ball.r < 0 ? ball.r : H - ball.r;
    sounds.wall();
    spawnParticles(ball.x, ball.y, BALL_COLOR, 5);
  }
  
  // Paddle Collision
  const checkHit = (p, isP1) => {
    if(ball.y > p.y - ball.r && ball.y < p.y + paddleH + ball.r) {
      if(isP1 ? (ball.x - ball.r < p.x + paddleW && ball.x > p.x) : (ball.x + ball.r > p.x && ball.x < p.x + paddleW)) {
        const hitPoint = (ball.y - (p.y + paddleH/2)) / (paddleH/2); 
        const angle = hitPoint * (Math.PI/3); 
        
        const speed = Math.min(maxBallSpeed, Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 1.05);
        const dir = isP1 ? 1 : -1;
        
        ball.vx = dir * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
        
        ball.x = isP1 ? p.x + paddleW + ball.r : p.x - ball.r;
        sounds.paddle();
        spawnParticles(ball.x, ball.y, p.color, 15);
        updateUI();
      }
    }
  };
  checkHit(p1, true);
  checkHit(p2, false);
  
  // Score
  if(ball.x < 0) {
    score2++; sounds.score();
    impactText = { text: score2, x: W*0.75, y: H/2, alpha: 1, color: P2_COLOR };
    if(score2 >= 7) endGame(2); else resetBall(2);
    updateUI();
  } else if(ball.x > W) {
    score1++; sounds.score();
    impactText = { text: score1, x: W*0.25, y: H/2, alpha: 1, color: P1_COLOR };
    if(score1 >= 7) endGame(1); else resetBall(1);
    updateUI();
  }
};

const drawRoundRect = (x, y, w, h, r, color, shadow=true) => {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
  ctx.fillStyle = color;
  if(shadow) { ctx.shadowBlur = 15; ctx.shadowColor = color; }
  ctx.fill();
  ctx.shadowBlur = 0;
};

const draw = () => {
  ctx.clearRect(0, 0, W, H);
  
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 4; ctx.setLineDash([15, 15]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  
  if(impactText && impactText.alpha > 0) {
    ctx.font = '900 150px Orbitron';
    ctx.fillStyle = impactText.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = impactText.alpha * 0.3;
    ctx.fillText(impactText.text, impactText.x, impactText.y);
    ctx.globalAlpha = 1;
    impactText.alpha -= 0.02;
    impactText.y -= 1;
  }
  
  drawRoundRect(p1.x, p1.y, paddleW, paddleH, 5, p1.color);
  drawRoundRect(p2.x, p2.y, paddleW, paddleH, 5, p2.color);
  
  if(state === 'playing' || state === 'countdown') {
    ball.trail.forEach((pos, i) => {
      ctx.beginPath(); ctx.arc(pos.x, pos.y, ball.r * (i/5), 0, Math.PI*2);
      ctx.fillStyle = BALL_COLOR; ctx.globalAlpha = i / 10; ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = BALL_COLOR;
    ctx.shadowBlur = 20; ctx.shadowColor = BALL_COLOR; ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  if(state === 'countdown') {
    ctx.font = '900 80px Orbitron';
    ctx.fillStyle = BALL_COLOR;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowBlur = 20; ctx.shadowColor = BALL_COLOR;
    ctx.fillText(countdown > 0 ? countdown : 'GO!', W/2, H/2 - 50);
    ctx.shadowBlur = 0;
  }
};

const loop = () => {
  update();
  draw();
  requestAnimationFrame(loop);
};
loop();

</script>
</body>
</html>
